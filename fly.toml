# fly.toml app configuration file generated for kjvstudy on 2025-05-26T12:55:54-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kjvstudy'
primary_region = 'iad'

[deploy]
strategy = "bluegreen"

[build]

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 2
processes = ['app']

[http_service.concurrency]
type = "requests"
hard_limit = 250
soft_limit = 200

# Health check endpoint
[[http_service.checks]]
interval = "15s"
timeout = "10s"
grace_period = "30s"
method = "GET"
path = "/health"

[[vm]]
memory = '4gb'
cpu_kind = 'performance'
cpus = 2

[env]
# Production optimizations
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

# Preload interlinear data on startup for fast first requests
PRELOAD_INTERLINEAR = "true"

# Number of Uvicorn workers (recommended: 2x CPU cores)
WORKERS = "4"
