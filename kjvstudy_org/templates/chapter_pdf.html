<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book }} {{ chapter }} (KJV)</title>
    <style>
        @page {
            size: letter;
            margin: 0.85in;
            @bottom-center {
                content: counter(page);
                font-family: "et-book", Georgia, serif;
                font-size: 10pt;
                color: #666;
            }
        }

        body {
            font-family: "et-book", Georgia, "Times New Roman", serif;
            font-size: 11.25pt;
            line-height: 1.65;
            color: #111;
        }

        h1 {
            font-weight: normal;
            letter-spacing: 0.05em;
            font-size: 24pt;
            margin: 0 0 0.1in 0;
        }

        .subtitle {
            font-style: italic;
            color: #666;
            margin-bottom: 0.3in;
        }

        .chapter-meta {
            font-size: 10pt;
            color: #666;
            margin-bottom: 0.35in;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.15in;
        }

        .verses {
            margin-bottom: 0.4in;
        }

        .verse {
            display: flex;
            gap: 0.15in;
            margin-bottom: 0.08in;
        }

        .verse-number {
            font-variant-numeric: lining-nums;
            font-size: 10pt;
            color: #777;
            min-width: 0.35in;
            text-align: right;
        }

        .verse-text {
            flex: 1;
            text-align: justify;
        }

        .footer {
            margin-top: 0.4in;
            font-size: 9pt;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>{{ book }} {{ chapter }}</h1>
    <p class="subtitle">Authorized King James Version (KJV)</p>
    <p class="chapter-meta">{{ verse_count }} verses &middot; Suitable for study, teaching, or printing.</p>

    <div class="verses">
        {% for verse in verses %}
        <div class="verse">
            <span class="verse-number">{{ verse.verse }}</span>
            <span class="verse-text">{{ verse.text }}</span>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        From KJV Study &bull; kjvstudy.org
    </div>
</body>
</html>
