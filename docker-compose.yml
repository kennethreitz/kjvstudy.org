services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - PRELOAD_INTERLINEAR=true
      - DISABLE_ANALYTICS=true
      # In production, restrict accepted Host headers (comma-separated):
      # - ALLOWED_HOSTS=kjvstudy.org,www.kjvstudy.org,localhost
    restart: unless-stopped
    command: uv run granian kjvstudy_org.server:api --interface asgi --host 0.0.0.0 --port 8000 --reload --static-path-route /static --static-path-mount /app/kjvstudy_org/static
