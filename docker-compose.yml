services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - PRELOAD_INTERLINEAR=true
    restart: unless-stopped
    command: uv run uvicorn kjvstudy_org.server:app --host 0.0.0.0 --port 8000 --reload
