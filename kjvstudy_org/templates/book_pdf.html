<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book }} (KJV)</title>
    <style>
        @page {
            size: letter;
            margin: 0.75in;
            @bottom-center {
                content: counter(page);
                font-family: "et-book", Georgia, serif;
                font-size: 10pt;
                color: #666;
            }
        }

        body {
            font-family: "et-book", Georgia, "Times New Roman", serif;
            font-size: 11pt;
            line-height: 1.55;
            color: #111;
        }

        h1 {
            font-weight: normal;
            letter-spacing: 0.05em;
            font-size: 26pt;
            margin: 0 0 0.15in 0;
        }

        .subtitle {
            font-style: italic;
            color: #666;
            margin-bottom: 0.25in;
        }

        .book-meta {
            font-size: 10pt;
            color: #666;
            margin-bottom: 0.35in;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.15in;
        }

        .chapter-block {
            page-break-inside: avoid;
            margin-bottom: 0.35in;
            padding-bottom: 0.2in;
            border-bottom: 1px solid #eee;
        }

        .chapter-block:last-of-type {
            border-bottom: none;
        }

        .chapter-title {
            font-size: 16pt;
            margin: 0 0 0.15in 0;
        }

        .verse {
            display: flex;
            gap: 0.15in;
            margin-bottom: 0.06in;
        }

        .verse-number {
            font-variant-numeric: lining-nums;
            font-size: 10pt;
            color: #777;
            min-width: 0.35in;
            text-align: right;
        }

        .verse-text {
            flex: 1;
            text-align: justify;
        }

        .footer {
            margin-top: 0.4in;
            font-size: 9pt;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>{{ book }}</h1>
    <p class="subtitle">Authorized King James Version (KJV)</p>
    <p class="book-meta">{{ chapter_count }} chapters &middot; {{ verse_count }} verses</p>

    {% for chapter in chapters %}
    <section class="chapter-block">
        <h2 class="chapter-title">Chapter {{ chapter.chapter }}</h2>
        {% for verse in chapter.verses %}
        <div class="verse">
            <span class="verse-number">{{ verse.verse }}</span>
            <span class="verse-text">{{ verse.text }}</span>
        </div>
        {% endfor %}
    </section>
    {% endfor %}

    <div class="footer">
        From KJV Study &bull; kjvstudy.org
    </div>
</body>
</html>
