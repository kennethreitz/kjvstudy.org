[project]
name = "kjvstudy-org"
version = "0.1.0"
description = "Study the King James Bible with AI-powered commentary and insights"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "ged4py>=0.5.2",
    "mistune>=3.0.2",
    "parse>=1.20.2",
    "python-gedcom>=1.0.0",
    "requests>=2.32.3",
    "weasyprint>=66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
]

[project.scripts]
kjvstudy-org = "kjvstudy_org.main:main"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kjvstudy_org*"]

[tool.setuptools.package-data]
kjvstudy_org = ["static/*", "templates/*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore:.*example.* has been deprecated.*:DeprecationWarning",
]
