{% extends "base.html" %}

{% block title %}Bookmarks - KJV Study{% endblock %}
{% block description %}Your saved bookmarks from KJV Study.{% endblock %}

{% block head %}
<style>
.bookmarks-container {
    max-width: 700px;
}

.bookmarks-empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
}

.bookmarks-empty p {
    margin-bottom: 1rem;
}

.bookmark-list {
    list-style: none;
    padding: 0;
    margin: 2rem 0;
}

.bookmark-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 0.75rem;
    background: var(--bg-color);
    transition: all 0.15s;
}

.bookmark-item:hover {
    border-color: var(--link-color);
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.bookmark-info {
    flex: 1;
}

.bookmark-title {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text-color);
    text-decoration: none;
    border-bottom: none;
}

.bookmark-title:hover {
    color: var(--link-color);
}

.bookmark-date {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
}

.bookmark-remove {
    background: none;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.85rem;
    transition: all 0.15s;
}

.bookmark-remove:hover {
    border-color: #c41e3a;
    color: #c41e3a;
    background: rgba(196, 30, 58, 0.05);
}

.clear-all-btn {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    background: none;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.9rem;
    transition: all 0.15s;
}

.clear-all-btn:hover {
    border-color: #c41e3a;
    color: #c41e3a;
}

[data-theme="dark"] .bookmark-item {
    background: #1a1a1a;
    border-color: #333;
}

[data-theme="dark"] .bookmark-item:hover {
    border-color: var(--link-color);
}
</style>
{% endblock %}

{% block content %}
<div class="bookmarks-container">
    <h1>Bookmarks</h1>

    <div id="bookmarks-content">
        <!-- Populated by JavaScript -->
    </div>
</div>

<script>
(function() {
    function getBookmarks() {
        try {
            return JSON.parse(localStorage.getItem('kjvBookmarks') || '[]');
        } catch (e) {
            return [];
        }
    }

    function saveBookmarks(bookmarks) {
        localStorage.setItem('kjvBookmarks', JSON.stringify(bookmarks));
    }

    function formatDate(dateStr) {
        var date = new Date(dateStr);
        return date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric'
        });
    }

    function removeBookmark(url) {
        var bookmarks = getBookmarks();
        bookmarks = bookmarks.filter(function(b) { return b.url !== url; });
        saveBookmarks(bookmarks);
        renderBookmarks();
    }

    function clearAllBookmarks() {
        if (confirm('Remove all bookmarks?')) {
            localStorage.removeItem('kjvBookmarks');
            renderBookmarks();
        }
    }

    function renderBookmarks() {
        var container = document.getElementById('bookmarks-content');
        var bookmarks = getBookmarks();

        if (bookmarks.length === 0) {
            container.innerHTML =
                '<div class="bookmarks-empty">' +
                    '<p>No bookmarks yet.</p>' +
                    '<p>Click the <strong>☆</strong> button on any page to save it here.</p>' +
                '</div>';
            return;
        }

        var html = '<ul class="bookmark-list">';
        bookmarks.forEach(function(bookmark) {
            html += '<li class="bookmark-item">' +
                '<div class="bookmark-info">' +
                    '<a href="' + bookmark.url + '" class="bookmark-title">' + bookmark.title + '</a>' +
                    '<div class="bookmark-date">Saved ' + formatDate(bookmark.date) + '</div>' +
                '</div>' +
                '<button class="bookmark-remove" onclick="removeBookmark(\'' + bookmark.url + '\')" title="Remove bookmark">Remove</button>' +
            '</li>';
        });
        html += '</ul>';

        if (bookmarks.length > 1) {
            html += '<button class="clear-all-btn" onclick="clearAllBookmarks()">Clear all bookmarks</button>';
        }

        container.innerHTML = html;
    }

    // Make functions global for onclick handlers
    window.removeBookmark = removeBookmark;
    window.clearAllBookmarks = clearAllBookmarks;

    // Initial render
    renderBookmarks();
})();
</script>
{% endblock %}
