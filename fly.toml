# fly.toml app configuration file generated for kjvstudy on 2025-05-26T12:55:54-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kjvstudy'
primary_region = 'iad'

[deploy]
strategy = "bluegreen"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[http_service.concurrency]
type = "requests"
hard_limit = 250
soft_limit = 200

# Health check endpoint
[[http_service.checks]]
interval = "15s"
timeout = "10s"
grace_period = "30s"
method = "GET"
path = "/health"

[[vm]]
memory = '2gb'
cpu_kind = 'shared'
cpus = 2

[env]
# Production optimizations
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

# Lazy-load interlinear data to reduce memory usage
PRELOAD_INTERLINEAR = "false"

# Granian: 2 workers x 2 runtime threads on shared-cpu-2x
WORKERS = "2"
RUNTIME_THREADS = "2"
